[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exifwipe"
version = "1.3.0"
description = "Strip EXIF, GPS, XMP, MakerNotes, HEIC/AVIF EXIF and DNG/RAW metadata from images/PDFs so exiftool returns blank — losslessly where physics allows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "loucas" }]
keywords = ["osint", "exif", "metadata", "privacy", "exiftool", "dng", "raw", "cr2", "nef"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = [
    "Pillow>=8.0",
]

[project.optional-dependencies]
verify = ["piexif>=1.1.3"]      # JPEG round-trip verify after save
heif = ["pillow-heif"]         # HEIC / AVIF input
pdf = ["pikepdf"]              # PDF /DocInfo + XMP strip
dev = ["pytest>=7.0", "piexif>=1.1.3"]

[project.scripts]
exifwipe = "exifwipe:main"

[tool.setuptools]
py-modules = ["exifwipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
